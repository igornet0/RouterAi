[workspace]
resolver = "2"
members = [
    "crates/universal-ai",
    "crates/universal-ai-cli",
    "crates/routerai",
    "crates/routerai-adapters",
    "crates/routerai-server",
    "crates/routerai-cli",
]
default-members = [
    "crates/universal-ai",
    "crates/universal-ai-cli",
    "crates/routerai",
    "crates/routerai-adapters",
    "crates/routerai-server",
    "crates/routerai-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/igornet0/RouterAi"
rust-version = "1.75"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
routerai = { path = "crates/routerai" }
routerai-adapters = { path = "crates/routerai-adapters" }
rust_decimal = { version = "1", features = ["serde-with-str"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
universal-ai = { path = "crates/universal-ai" }
uuid = { version = "1", features = ["serde", "v4"] }
wiremock = "0.6"
zeroize = "1"
